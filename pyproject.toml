[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaeval-ar"
version = "0.1.0"
description = "Evaluation harness for LLM pharmacy knowledge in Arabic and English, with fictional-drug hallucination traps"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.5,<3"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
pharmaeval = "pharmaeval.cli:main"

[tool.setuptools]
packages = ["pharmaeval"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
